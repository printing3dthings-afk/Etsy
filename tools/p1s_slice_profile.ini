nozzle_diameter = 0.4
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 20
temperature = 220
first_layer_temperature = 230
bed_temperature = 60
first_layer_bed_temperature = 60
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
support_material = 0
skirts = 0
brim_width = 0
extrusion_width = 0.42
# perimeter_speed is the INTERNAL walls; external_perimeter_speed below is the
# visible one. CLAUDE.md's production rule -- 'outer wall 50 mm/s or lower' --
# is about the OUTER wall only, but this profile had both at 50, and a
# thin-walled part is almost entirely perimeter so it inherited 50 everywhere.
# Measured on the label bin: 4h16 at 50 vs 3h44 at 200, identical filament and
# nothing visible changed. Raised 2026-09-09. This makes every print-time figure
# quoted BEFORE this date pessimistic, not wrong.
perimeter_speed = 200
external_perimeter_speed = 50
infill_speed = 200
# Same bug as perimeter_speed above, found the same way and three keys wider.
# These were never set, so PrusaSlicer's own stock defaults ran: solid infill
# at 20 mm/s, top solid at 15, and small_perimeter_speed at 15. Measured on the
# wall shelf's g-code: 27,840 solid-infill moves at 20 mm/s, and 39,000+
# perimeter moves that fell to 15 because every hex lattice cell is a "small"
# loop. Solid infill alone was 37% of a 5h20 print. Nothing visible is sped up
# here: small_perimeter_speed is pinned to the same 50 the outer wall already
# uses, so CLAUDE.md's 'outer wall 50 mm/s or lower' production rule still
# holds on every surface a customer sees. Set 2026-09-10.
solid_infill_speed = 200
top_solid_infill_speed = 80
small_perimeter_speed = 50
travel_speed = 300
gcode_flavor = marlin2
