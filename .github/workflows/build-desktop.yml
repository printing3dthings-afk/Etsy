name: Build Desktop App

# Produces the real, installable Frank desktop app for Windows (.exe) and macOS
# (.dmg). Runs on GitHub-hosted windows-latest/macos-latest runners so the
# native installer format matches the target OS (NSIS on Windows, DMG on
# macOS -- electron-builder needs to run on the platform it's packaging for
# most reliably, especially for the macOS .icns conversion step below).
#
# (2026-08-06) No Python/PyInstaller step anymore -- the desktop app is a
# thin Electron client that loads the live Railway deployment directly (see
# desktop/main.js's docstring), so there's no backend to bundle. This used to
# build and package a full local copy of tools/api_server/main.py per
# platform; that step (and tools/desktop/backend.spec / build_backend.py) is
# archived, not deleted -- see data/trash/DELETED.md if that model is ever
# needed again.
#
# (2026-08-06, one-click distribution) Each installer is ALSO published as an
# asset on a single, permanent GitHub Release tagged `desktop-latest`. That
# release is never deleted or re-tagged -- softprops/action-gh-release just
# updates its existing assets on every run, in place -- so the two download
# URLs below never change no matter how many times this workflow re-runs:
#   https://github.com/printing3dthings-afk/etsy/releases/download/desktop-latest/Frank-Setup.exe
#   https://github.com/printing3dthings-afk/etsy/releases/download/desktop-latest/Frank.dmg
# Scott can bookmark either one directly -- one click, no GitHub login, no
# hunting through Actions run artifacts. package.json's build.win/mac.
# artifactName is pinned to "Frank-Setup.${ext}"/"Frank.${ext}" (no version
# number) specifically so these filenames -- and therefore these URLs --
# never drift as the app's version bumps.
#
# Manual trigger only for now (workflow_dispatch) -- the app changes rarely,
# so auto-building on every push would waste CI minutes for no benefit; a
# rebuild only needs to happen when desktop/ itself changes.

on:
  workflow_dispatch: {}

permissions:
  contents: write  # required to create/update the desktop-latest release

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win

      - name: Upload Windows installer (CI artifact, 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: frank-windows-installer
          path: dist/desktop-app/*.exe
          if-no-files-found: error

      - name: Publish to the permanent desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Frank Desktop (latest)
          body: |
            Auto-published by the Build Desktop App workflow. These two
            files are always the current build -- this release is updated
            in place, never re-tagged, so the download links never change.

            Unsigned installers (no Apple/Microsoft certificate): Windows
            SmartScreen and macOS Gatekeeper will each show one warning on
            first launch. Windows: "More info" -> "Run anyway". macOS:
            right-click the app -> "Open".
          draft: false
          prerelease: false
          make_latest: true
          files: dist/desktop-app/*.exe

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build .icns from the committed icon.png
        # iconutil is macOS-only, which is exactly why this step can't run anywhere
        # else -- see tools/desktop/generate_icon.py's docstring. Standard 10-size
        # .iconset layout Apple's tooling expects.
        run: |
          ICONSET=desktop/build/icon.iconset
          mkdir -p "$ICONSET"
          SRC=desktop/build/icon.png
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          cp "$SRC" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o desktop/build/icon.icns

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS disk image
        working-directory: desktop
        run: npm run build:mac

      - name: Upload macOS installer (CI artifact, 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: frank-macos-installer
          path: dist/desktop-app/*.dmg
          if-no-files-found: error

      - name: Publish to the permanent desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Frank Desktop (latest)
          body: |
            Auto-published by the Build Desktop App workflow. These two
            files are always the current build -- this release is updated
            in place, never re-tagged, so the download links never change.

            Unsigned installers (no Apple/Microsoft certificate): Windows
            SmartScreen and macOS Gatekeeper will each show one warning on
            first launch. Windows: "More info" -> "Run anyway". macOS:
            right-click the app -> "Open".
          draft: false
          prerelease: false
          make_latest: true
          files: dist/desktop-app/*.dmg

# Known limitation, not fixed here: the macOS .dmg is unsigned/unnotarized (no Apple
# Developer certificate, $99/yr, configured). Gatekeeper will show "unidentified
# developer" on first launch -- right-click -> Open bypasses it. Fine for personal use,
# worth revisiting if this is ever distributed more broadly.
