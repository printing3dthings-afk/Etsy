name: Daily Listing Integrity Check

# 2026-07-10: schedule trigger disabled as part of an Etsy-API-volume
# reduction pass (see ops_runbook.md). This workflow was fully redundant
# with tools/api_server/main.py's in-app `_quality_audit_loop`, which runs
# the same listing_integrity_check.py script on its own daily timer inside
# the live server -- both existing at once would have doubled audit-related
# Etsy call volume for zero added benefit the moment this workflow's broken
# GH_PAT_SECRETS dependency got fixed (it had delivered zero successful runs
# since creation). Kept as workflow_dispatch for an on-demand manual run;
# re-enable the schedule only if the in-app loop is ever removed instead.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Etsy rotates the refresh token on every use. Without writing the new
      # refresh token back to the repo secret, tomorrow's run would fail with
      # invalid_grant. This step fails loudly (rather than skipping) if the
      # required PAT secret (GH_PAT_SECRETS) hasn't been configured yet --
      # see tools/ci_refresh_etsy_secrets.py for the full explanation.
      #
      # RAILWAY_APP_URL / APP_SECRET_TOKEN are optional but recommended: the
      # live dashboard server also rotates this same refresh token reactively,
      # so without a shared source of truth this workflow and the live server
      # can silently invalidate each other's copy (diagnosed 2026-06-17, see
      # ops_runbook.md). When both secrets are set, this step syncs lineage
      # with the live server before and after refreshing.
      - name: Refresh Etsy OAuth token and rotate secrets
        env:
          ETSY_CLIENT_ID: ${{ secrets.ETSY_CLIENT_ID }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
          RAILWAY_APP_URL: ${{ secrets.RAILWAY_APP_URL }}
          APP_SECRET_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
        run: python tools/ci_refresh_etsy_secrets.py

      - name: Run listing integrity check (fast mode)
        id: integrity
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_CLIENT_ID: ${{ secrets.ETSY_CLIENT_ID }}
          ETSY_CLIENT_SECRET: ${{ secrets.ETSY_CLIENT_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          # ETSY_ACCESS_TOKEN was refreshed and exported to GITHUB_ENV by the
          # previous step, so it's already in the environment here.
        run: |
          set +e
          python tools/listing_integrity_check.py --save 2>&1 | tee integrity_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report-${{ github.run_id }}
          path: |
            integrity_output.txt
            review_batches/*.txt
          retention-days: 30

      - name: Open or update GitHub issue on FAIL
        if: steps.integrity.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_report_issue.py integrity_output.txt

      - name: Fail the job if FAIL-level issues were found
        if: steps.integrity.outputs.exit_code == '1'
        run: exit 1
