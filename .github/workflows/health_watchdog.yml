name: Frank Health Watchdog

# External uptime check for the live Frank deployment. This is intentionally
# separate from listing_integrity_daily.yml (different cadence, and /health is
# unauthenticated — no Etsy OAuth setup needed). If the whole Railway
# container is down, nothing inside it can alert Scott, so this has to live
# outside the app itself.
#
# Note: GitHub Actions cron has known drift — a */5 schedule often actually
# fires every 7-15 minutes during busy platform periods. That's fine for an
# outage alert, not meant to be a precision SLA tool.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check /health endpoint
        id: health
        env:
          RAILWAY_APP_URL: ${{ secrets.RAILWAY_APP_URL }}
        run: |
          if [ -z "$RAILWAY_APP_URL" ]; then
            echo "ERROR: RAILWAY_APP_URL secret is not set — cannot reach the live deployment." >&2
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "details=RAILWAY_APP_URL secret is not configured (Settings -> Secrets and variables -> Actions)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          response=$(curl -sS -m 15 -w "\n%{http_code}" "${RAILWAY_APP_URL%/}/health")
          curl_exit=$?
          set -e
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code"
          echo "$body"
          if [ $curl_exit -ne 0 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "details=curl failed with exit code $curl_exit (timeout or connection error) hitting ${RAILWAY_APP_URL%/}/health" >> "$GITHUB_OUTPUT"
          elif [ "$http_code" != "200" ] || ! echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            {
              echo "details<<EOF"
              echo "HTTP $http_code"
              echo "$body"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "details=HTTP 200, status ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_report_health_issue.py "${{ steps.health.outputs.status }}" "${{ steps.health.outputs.details }}"

      - name: Fail the job if the health check failed
        if: steps.health.outputs.status == 'fail'
        run: exit 1

      # 2026-07-17: piggybacks on this same cron/permissions rather than a new
      # workflow — see tools/check_default_branch.py's docstring for why this
      # exists (the 2026-07-10 incident: GitHub's default_branch silently
      # pointed at a stale integration branch, so every schedule-triggered
      # workflow — including this one — ran old, broken code for an unknown
      # period before anyone noticed).
      - name: Check GitHub default branch hasn't drifted
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(python tools/check_default_branch.py 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ $rc -ne 0 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "details<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report branch-drift result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_report_branch_drift_issue.py "${{ steps.branch.outputs.status }}" "${{ steps.branch.outputs.details }}"

      - name: Fail the job if the default branch has drifted
        if: steps.branch.outputs.status == 'fail'
        run: exit 1
